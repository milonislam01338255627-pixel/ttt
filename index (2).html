<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>টেস্ট সাইট</title>
<style>
body{font-family:system-ui,sans-serif;max-width:480px;margin:0 auto;padding:20px;text-align:center}
button{font-size:18px;padding:14px 20px;border:0;border-radius:10px;background:#4f46e5;color:#fff;width:100%}
#msg{margin-top:16px;font-size:16px;word-break:break-word}
</style></head><body>
<h2>🔔 টেস্ট সাইট</h2>
<p>নিচের বাটনে চাপুন, তারপর "Allow" দিন।</p>
<button id="b">নোটিফিকেশন চালু করুন</button>
<div id="msg"></div>
<script>
var HOST = "https://push-2-no3e.onrender.com";
var APP_ID = "76fcafa3d76a2ffa";
function toKey(v){var p="=".repeat((4-v.length%4)%4);var r=atob((v+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(r.split("").map(function(c){return c.charCodeAt(0)}))}
async function subscribe(){
  if(!("serviceWorker" in navigator)||!("PushManager" in window)) throw new Error("এই ব্রাউজারে পুশ সাপোর্ট নেই");
  var perm = await Notification.requestPermission();
  if(perm!=="granted") throw new Error("অনুমতি দেওয়া হয়নি");
  var cfg = await (await fetch(HOST+"/v1/config/"+APP_ID)).json();
  var reg = await navigator.serviceWorker.register("pushsaas-sw.js");
  await navigator.serviceWorker.ready;
  var sub = (await reg.pushManager.getSubscription()) ||
    (await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:toKey(cfg.publicKey)}));
  await fetch(HOST+"/v1/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({app_id:APP_ID,subscription:sub.toJSON()})});
}
document.getElementById("b").onclick = async function(){
  var m=document.getElementById("msg");
  m.textContent="অপেক্ষা করুন... (প্রথমবার ১ মিনিট লাগতে পারে)";
  try{ await subscribe(); m.textContent="✅ চালু হয়েছে! এবার ড্যাশবোর্ড থেকে টেস্ট পাঠান."; }
  catch(e){ m.textContent="❌ "+e.message; }
};
</script></body></html>
